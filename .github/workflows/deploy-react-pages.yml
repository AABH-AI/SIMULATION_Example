name: Deploy master-react_v2 to GitHub Pages

on:
  push:
    branches: [master-react_v2]
  workflow_dispatch:

# Native GitHub Actions Pages deployment — builds the Vite app and uploads
# the dist/ output directly to Pages infrastructure. Nothing is committed
# back to the branch (dist/ stays gitignored, matching this branch's own
# convention); requires the repo's Pages "Source" setting to be "GitHub
# Actions" rather than "Deploy from a branch".
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
